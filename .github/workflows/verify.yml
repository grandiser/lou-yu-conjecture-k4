name: Verify Lean 4 proof

on:
  push:
  pull_request:

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: LouYuK4
      - name: Check axioms and forbidden tokens
        run: ./verify.sh --skip-build
